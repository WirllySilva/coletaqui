services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: coletaqui
      POSTGRES_USER: coletaqui
      POSTGRES_PASSWORD: coletaqui
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coletaqui -d coletaqui"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/coletaqui
      DATABASE_USERNAME: coletaqui
      DATABASE_PASSWORD: coletaqui
      JWT_SECRET: alterar-em-producao
      OTP_EXPIRATION_MINUTES: 5
      JPA_DDL_AUTO: update
      UPLOAD_LOCAL_DIR: /app/uploads/tree-plantings
      UPLOAD_PUBLIC_BASE_URL: /uploads/tree-plantings
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SUPABASE_TREE_BUCKET: ${SUPABASE_TREE_BUCKET:-tree-plantings}
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  postgres_data:
  backend_uploads:
