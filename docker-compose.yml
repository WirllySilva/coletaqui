services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: coletaqui
      POSTGRES_USER: coletaqui
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coletaqui}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coletaqui -d coletaqui"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/coletaqui
      DATABASE_USERNAME: coletaqui
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-coletaqui}
      JWT_SECRET: ${JWT_SECRET:-alterar-em-producao-local}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      OTP_EXPIRATION_MINUTES: ${OTP_EXPIRATION_MINUTES:-5}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_EXPOSE_DEV_CODE: ${OTP_EXPOSE_DEV_CODE:-true}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      TWILIO_VERIFY_ENABLED: ${TWILIO_VERIFY_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      TWILIO_VERIFY_LOCALE: ${TWILIO_VERIFY_LOCALE:-pt-BR}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_ADMIN_NAME: ${APP_ADMIN_NAME:-Administrador Coletaqui}
      APP_ADMIN_PHONE: ${APP_ADMIN_PHONE:-00000000000}
      SUPPORT_WHATSAPP_MESSAGE: ${SUPPORT_WHATSAPP_MESSAGE:-Ola! Preciso de ajuda com o Coletaqui Aracoiaba.}
      UPLOAD_LOCAL_DIR: /app/uploads/tree-plantings
      UPLOAD_PUBLIC_BASE_URL: /uploads/tree-plantings
      CONTENT_IMAGE_LOCAL_DIR: /app/uploads/content-images
      CONTENT_IMAGE_PUBLIC_BASE_URL: /uploads/content-images
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SUPABASE_TREE_BUCKET: ${SUPABASE_TREE_BUCKET:-tree-plantings}
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  postgres_data:
  backend_uploads:
