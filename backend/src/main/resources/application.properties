spring.application.name=coletaqui-backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/coletaqui}
spring.datasource.username=${DATABASE_USERNAME:coletaqui}
spring.datasource.password=${DATABASE_PASSWORD:coletaqui}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

app.jwt.secret=${JWT_SECRET:alterar-em-producao-com-uma-chave-maior}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:5256000}
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:5}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.expose-dev-code=${OTP_EXPOSE_DEV_CODE:true}
app.otp.channel=${OTP_CHANNEL:SMS}
app.twilio.verify.enabled=${TWILIO_VERIFY_ENABLED:false}
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:}
app.twilio.verify.channel=${TWILIO_VERIFY_CHANNEL:sms}
app.twilio.verify.locale=${TWILIO_VERIFY_LOCALE:auto}
app.upload.local-dir=${UPLOAD_LOCAL_DIR:uploads/tree-plantings}
app.upload.public-base-url=${UPLOAD_PUBLIC_BASE_URL:/uploads/tree-plantings}
app.content-image.local-dir=${CONTENT_IMAGE_LOCAL_DIR:uploads/content-images}
app.content-image.public-base-url=${CONTENT_IMAGE_PUBLIC_BASE_URL:/uploads/content-images}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.name=${APP_ADMIN_NAME:Administrador Coletaqui}
app.admin.phone=${APP_ADMIN_PHONE:00000000000}
app.supabase.url=${SUPABASE_URL:}
app.supabase.service-key=${SUPABASE_SERVICE_KEY:}
app.supabase.tree-bucket=${SUPABASE_TREE_BUCKET:tree-plantings}
app.support.whatsapp-message=${SUPPORT_WHATSAPP_MESSAGE:Ola! Preciso de ajuda com o Coletaqui Aracoiaba.}
app.push.vapid.public-key=${VAPID_PUBLIC_KEY:}
app.push.vapid.private-key=${VAPID_PRIVATE_KEY:}
app.push.vapid.subject=${VAPID_SUBJECT:}
