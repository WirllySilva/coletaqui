spring.application.name=coletaqui-backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/coletaqui}
spring.datasource.username=${DATABASE_USERNAME:coletaqui}
spring.datasource.password=${DATABASE_PASSWORD:coletaqui}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}
