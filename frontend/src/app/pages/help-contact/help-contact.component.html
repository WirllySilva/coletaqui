<div class="menu-page" [class.collector-help]="isCollector">
  <app-header />

  <main class="menu-content">
    <button type="button" class="back-link" (click)="goBack()"><i class="bi bi-arrow-left"></i> Voltar</button>

    <section class="page-heading">
      <h1>Ajuda e contato</h1>
      <p>{{ isCollector ? 'Suporte para uso do painel do coletor.' : 'Encontre orientação rápida para usar o Coletaqui na comunidade.' }}</p>
    </section>

    <p class="error-message" *ngIf="error">{{ error }}</p>

    <button type="button" class="contact-card contact-button" (click)="openWhatsApp()">
      <i class="bi bi-whatsapp"></i>
      <div>
        <h2>Atendimento pelo WhatsApp</h2>
        <p>{{ contact?.phone ? ('Falar com a equipe pelo telefone ' + contact?.phone) : 'Canal reservado para dúvidas, suporte e comunicação com a equipe do projeto.' }}</p>
      </div>
      <i class="bi bi-box-arrow-up-right"></i>
    </button>

    <section class="list-card">
      <h2>Podemos ajudar com</h2>
      <ul>
        <li *ngFor="let topic of (isCollector ? collectorTopics : topics)"><i class="bi bi-check-circle"></i>{{ topic }}</li>
      </ul>
    </section>
  </main>

  <app-footer />
</div>
