<div class="menu-page" [class.collector-settings]="isCollector">
  <app-header />

  <main class="menu-content">
    <button type="button" class="back-link" (click)="goBack()"><i class="bi bi-arrow-left"></i> Voltar</button>

    <section class="page-heading">
      <h1>Configurações</h1>
      <p>{{ isCollector ? 'Ajustes do painel do coletor e preferências de atendimento.' : 'Ajustes gerais do aplicativo e preferências de uso.' }}</p>
    </section>

    <p class="success-message" *ngIf="message">{{ message }}</p>
    <p class="error-message" *ngIf="error">{{ error }}</p>

    <section class="settings-card">
      <label class="setting-row">
        <span>
          <strong>Notificações</strong>
          <small>{{ isCollector ? 'Receber avisos sobre novas solicitações e agenda.' : 'Receber avisos sobre agendamentos e novidades.' }}</small>
        </span>
        <input type="checkbox" [ngModel]="notifications" (ngModelChange)="onNotificationChange($event)" />
      </label>

      <label class="setting-row">
        <span>
          <strong>Localização</strong>
          <small>{{ isCollector ? 'Usar localização para organizar rotas e solicitações próximas.' : 'Usar localização para sugerir pontos próximos.' }}</small>
        </span>
        <input type="checkbox" [ngModel]="location" (ngModelChange)="onLocationChange($event)" />
      </label>
    </section>

    <section class="settings-card">
      <a class="setting-link" routerLink="/terms">
        <i class="bi bi-file-text"></i>
        <span>
          <strong>Termos de Uso</strong>
          <small>Consulte as regras de uso do Coletaqui.</small>
        </span>
      </a>

      <a class="setting-link" routerLink="/privacy">
        <i class="bi bi-shield-check"></i>
        <span>
          <strong>Política de Privacidade</strong>
          <small>Veja como seus dados são tratados.</small>
        </span>
      </a>
    </section>
  </main>

  <app-footer />
</div>
