<header class="custom-header d-flex align-items-center px-3 pt-4">
  <div class="user-container d-flex align-items-center">
    <div class="dropdown" [class.show]="menuOpen">
      <button class="btn btn-link p-0 border-0" type="button" (click)="menuOpen = !menuOpen">
        <img src="assets/user-icon.png" alt="Usuário" class="rounded-circle" width="40" height="40" />
      </button>
      <div class="dropdown-menu dropdown-menu-end" [class.show]="menuOpen">
        <a class="dropdown-item" routerLink="/userdata"><i class="bi bi-person me-2"></i>Dados do Usuário</a>
        <a class="dropdown-item" routerLink="/"><i class="bi bi-share me-2"></i>Compartilhar App</a>
        <a class="dropdown-item" routerLink="/"><i class="bi bi-whatsapp me-2 text-success"></i>Fale Conosco</a>
        <a class="dropdown-item" routerLink="/"><i class="bi bi-gear me-2"></i>Configurações</a>
        <div class="dropdown-divider"></div>
        <a class="dropdown-item text-danger" routerLink="/"><i class="bi bi-box-arrow-right me-2"></i>Sair da Conta</a>
      </div>
    </div>
    <h5 class="mb-0 ms-2">Olá, nome do usuário!</h5>
  </div>
</header>
