<header class="custom-header d-flex align-items-center px-3 pt-4" [class.collector-header]="isCollector">
  <div class="user-container d-flex align-items-center">
    <div class="dropdown" [class.show]="menuOpen">
      <button class="btn btn-link p-0 border-0" type="button" (click)="menuOpen = !menuOpen">
        <img src="assets/user-icon.png" alt="Usuário" class="rounded-circle" width="40" height="40" />
      </button>
      <div class="dropdown-menu dropdown-menu-end" [class.show]="menuOpen">
        <a class="dropdown-item" routerLink="/userdata" (click)="menuOpen = false"><i class="bi bi-person me-2"></i>Meu perfil</a>
        <a class="dropdown-item" [routerLink]="isCollector ? '/collector-schedule' : '/my-requests'" (click)="menuOpen = false"><i class="bi bi-calendar-check me-2"></i>{{ isCollector ? 'Minha agenda' : 'Minhas solicitações' }}</a>
        <button class="dropdown-item" type="button" (click)="shareApp()"><i class="bi bi-share me-2"></i>Compartilhar app</button>
        <a class="dropdown-item" routerLink="/help-contact" (click)="menuOpen = false"><i class="bi bi-whatsapp me-2 text-success"></i>Ajuda e contato</a>
        <a class="dropdown-item" routerLink="/settings" (click)="menuOpen = false"><i class="bi bi-gear me-2"></i>Configurações</a>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item text-danger" type="button" (click)="logout()"><i class="bi bi-box-arrow-right me-2"></i>Sair da Conta</button>
      </div>
    </div>
    <h5 class="mb-0 ms-2">Olá, {{ userName }}!</h5>
  </div>
</header>
